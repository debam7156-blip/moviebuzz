# Project-wide Gradle settings.

# Required: the app uses AndroidX libraries.
android.useAndroidX=true

# Kotlin code style for this project.
kotlin.code.style=official

# Enable incremental builds and the configuration cache for faster CI.
org.gradle.incremental=true
org.gradle.caching=true

# Memory for the Gradle daemon on CI machines.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Non-transitive R classes for faster builds.
android.nonTransitiveRClass=true
